
name: Attendance App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-app-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: TEST APPLICATION
  # ==========================================
  test:
    name: Test PHP, JavaScript, Docker and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DB_PASS: ci_test_password
      DB_ROOT_PASSWORD: ci_test_root_password
      DB_NAME: attendance_test
      DB_USER: attendance_user
      DB_HOST: db

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      # 1. Set up PHP
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, curl
          tools: composer:v2
          coverage: none

      - name: Display PHP version
        run: php -v

      # 2. Check PHP syntax
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type d \( -name .git -o -name vendor -o -name node_modules \) -prune \
            -o -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      # 3. Install Composer dependencies when applicable
      - name: Install PHP dependencies
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-interaction --prefer-dist --no-progress

      # 4. Run PHPUnit tests when configured
      - name: Run PHPUnit tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          elif [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            echo "::error::PHPUnit configuration exists, but PHPUnit is not installed."
            exit 1
          else
            echo "::warning::No PHPUnit test suite found."
          fi

      # 5. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6. Check JavaScript syntax
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type d \( -name .git -o -name vendor -o -name node_modules \) -prune \
            -o -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      # 7. Validate Docker Compose configuration
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      # 8. Build Docker image
      - name: Build Docker image
        run: docker build --tag attendance-app:ci .

      # 9. Start application and MySQL
      - name: Start application and MySQL
        run: docker compose up -d --build

      # 10. Test application HTTP response
      - name: Test application HTTP response
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/ >/dev/null; then
              echo "Application HTTP check passed."
              exit 0
            fi

            echo "Waiting for application... attempt $attempt/30"
            sleep 5
          done

          echo "::error::Application did not respond successfully."
          docker compose ps
          docker compose logs --tail=100
          exit 1

      # 11. Stop test containers
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes --remove-orphans


  # ==========================================
  # JOB 2: DEPLOY TO AWS VPS
  # ==========================================
  deploy:
    name: Deploy to AWS VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    environment: production

    steps:

      # 1. Validate deployment secrets
      - name: Validate deployment settings
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST" || {
            echo "::error::VPS_HOST secret is missing."
            exit 1
          }

          test -n "$VPS_USER" || {
            echo "::error::VPS_USER secret is missing."
            exit 1
          }

          test -n "$VPS_PROJECT_PATH" || {
            echo "::error::VPS_PROJECT_PATH secret is missing."
            exit 1
          }

          test -n "$VPS_SSH_KEY_B64" || {
            echo "::error::VPS_SSH_KEY_B64 secret is missing."
            exit 1
          }

          test -n "$VPS_KNOWN_HOSTS" || {
            echo "::error::VPS_KNOWN_HOSTS secret is missing."
            exit 1
          }

          if [[ ! "$VPS_PROJECT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::VPS_PROJECT_PATH must be a safe absolute path."
            exit 1
          fi

      # 2. Configure SSH securely
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Decode the Base64 private key
          printf '%s' "$VPS_SSH_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/deploy_key"

          # Configure VPS host verification
          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            | tr -d '\r' > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Verify that the private key is readable
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          echo "SSH key configured successfully."

      # 3. Test SSH authentication
      - name: Test SSH authentication
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "whoami"

      # 4. Deploy application to AWS VPS
      - name: Deploy application to AWS VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$VPS_PROJECT_PATH'" <<'REMOTE'

          set -euo pipefail

          PROJECT_PATH="$1"

          echo "Entering project directory..."
          cd "$PROJECT_PATH"

          echo "Fetching latest application code..."
          git fetch origin main

          echo "Updating application..."
          git reset --hard origin/main

          echo "Validating Docker configuration..."
          docker compose config --quiet

          echo "Building and restarting application..."
          docker compose up -d --build --remove-orphans

          echo "Checking running containers..."
          docker compose ps

          echo "Checking application HTTP response..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/ >/dev/null; then
              echo "Deployment and HTTP check passed."
              exit 0
            fi

            echo "Waiting for application... attempt $attempt/30"
            sleep 5
          done

          echo "Deployment health check failed."
          docker compose ps
          docker compose logs --tail=100

          exit 1
          REMOTE

      # 5. Remove temporary SSH credentials
      - name: Clean up SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
