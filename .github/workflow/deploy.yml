
name: Attendance App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate PHP and build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Build Docker image
        run: docker build -t attendance-app-ci .

  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest
    needs: test

    # Deploy only after a successful push to main.
    # Pull requests run checks but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS SSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update application on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "set -e
            cd '$VPS_PROJECT_PATH'
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build web
            docker compose ps
            curl -fsS http://127.0.0.1:8080/ >/dev/null
            echo 'Deployment and HTTP check completed successfully.'"
